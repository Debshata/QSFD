# Dataset registry. Each entry describes how to locate and normalise one source.
# `kaggle_id` is passed to kagglehub.dataset_download().
# `target_positive` lists the raw values that mean "fraud".
datasets:

  creditcardfraud:
    kaggle_id: mlg-ulb/creditcardfraud
    description: >
      ULB European cardholder transactions, Sept 2013. Features V1..V28 are
      already PCA-anonymised; Time and Amount are raw.
    file_glob: "creditcard.csv"
    target: Class
    target_positive: [1]
    drop_columns: []
    # `Time` is seconds elapsed since the first transaction -> an index-like
    # column, not a usable feature. Kept as chronological ordering key only.
    time_column: Time
    drop_as_feature: [Time]
    amount_column: Amount
    identifier_columns: []
    chronological: true
    enabled: true

  fraud_detection_sim:
    kaggle_id: kartik2112/fraud-detection
    description: >
      Sparkov simulated credit-card transactions with rich merchant/customer
      metadata. Ships with a pre-split train and test file.
    file_glob: "fraudTrain.csv"
    target: is_fraud
    target_positive: [1]
    drop_columns: ["Unnamed: 0"]
    time_column: trans_date_trans_time
    # cc_num / trans_num / names / street identify the card or the transaction
    # itself: keeping them memorises individuals rather than learning fraud.
    drop_as_feature:
      - trans_num
      - cc_num
      - first
      - last
      - street
      - unix_time
      - merchant
      - city
      - job
      - dob
      - zip
      - trans_date_trans_time
    amount_column: amt
    identifier_columns: [trans_num, cc_num]
    chronological: true
    enabled: true

  creditcard_2023:
    kaggle_id: nelgiriyewithana/credit-card-fraud-detection-dataset-2023
    description: >
      2023 European credit-card transactions, PCA features V1..V28, balanced
      50/50 by construction (not a natural fraud base rate).
    file_glob: "creditcard_2023.csv"
    target: Class
    target_positive: [1]
    drop_columns: [id]
    time_column: null
    drop_as_feature: [id]
    amount_column: Amount
    identifier_columns: [id]
    chronological: false
    enabled: true

  synthetic_cc_fraud:
    kaggle_id: praneeth1265/synthetic-credit-card-transactions-fraud-detection
    description: >
      Synthetic transaction stream shipped with pre-engineered behavioural
      features (velocity counts, travel speed, location/merchant novelty).
      Note: these features were generated by the same process that generated
      the labels, so performance here is optimistic relative to real data.
    file_glob: "fraud_dataset_5l.csv"
    target: fraud_label
    target_positive: [1]
    drop_columns: []
    time_column: timestamp
    # user_id identifies the cardholder; timestamp is a raw string used only
    # for ordering. merchant/location are kept as low-cardinality categoricals.
    drop_as_feature: [user_id, timestamp]
    amount_column: amount
    identifier_columns: [user_id]
    chronological: true
    enabled: true

# Dataset used to train the model shipped to the fraud engine.
primary_dataset: creditcardfraud

# Heuristics used by the auto-detecting adapter.
autodetect:
  target_candidates:
    [is_fraud, isFraud, Class, class, fraud, Fraud, label, Label,
     target, is_fraudulent, fraud_flag, isFlaggedFraud, TX_FRAUD]
  # A column whose name matches these is treated as an identifier and dropped.
  identifier_patterns:
    ["^id$", "_id$", "^index$", "^unnamed", "num$", "uuid", "guid",
     "account", "card_number", "cc_num", "trans_num"]
  # Columns that can only be known *after* a fraud investigation.
  leakage_patterns:
    ["fraud_score", "fraud_reason", "chargeback", "dispute", "investigat",
     "confirmed", "outcome", "resolution", "is_flagged", "flagged_fraud",
     "risk_score", "fraud_prob", "label_source"]
  high_cardinality_threshold: 50
  max_categorical_cardinality: 60   # keeps US state codes usable, still excludes free-text merchant/city/job
