# Classical model configuration. Values are deliberately strong-but-fixed:
# no large hyperparameter search is performed (see docs/DECISIONS.md).

imbalance:
  # one of: none | class_weight | smote | undersample
  strategy: class_weight
  smote_sampling_strategy: 0.10   # minority:majority ratio after SMOTE
  undersample_ratio: 0.05

models:

  logistic_regression:
    enabled: true
    params:
      C: 0.1
      max_iter: 2000
      solver: lbfgs
      class_weight: balanced

  random_forest:
    enabled: true
    params:
      n_estimators: 300
      max_depth: 14
      min_samples_leaf: 2
      max_features: sqrt
      class_weight: balanced_subsample
      n_jobs: -1

  xgboost:
    enabled: true
    params:
      n_estimators: 400
      max_depth: 6
      learning_rate: 0.08
      subsample: 0.9
      colsample_bytree: 0.8
      min_child_weight: 2
      reg_lambda: 1.0
      tree_method: hist
      eval_metric: aucpr
      n_jobs: -1
    # scale_pos_weight is computed from the training split at fit time.
    auto_scale_pos_weight: true

  isolation_forest:
    enabled: true
    # Unsupervised anomaly detector: trained on the training features only.
    # Its output is an anomaly score, NOT a calibrated fraud probability.
    params:
      n_estimators: 300
      max_samples: auto
      contamination: auto
      n_jobs: -1

threshold:
  # Objective used to pick the operating point on the VALIDATION set.
  # one of: f1 | f2 | max_recall_at_precision | max_precision_at_recall | youden
  objective: f2
  min_precision: 0.50     # used by max_recall_at_precision
  min_recall: 0.80        # used by max_precision_at_recall
  search_points: 200

calibration:
  enabled: true
  # sigmoid (Platt) is the conservative default; isotonic is only attempted
  # when the validation split has enough positives.
  method: sigmoid
  min_val_positives_for_isotonic: 1000
  # Calibration is kept only if it improves validation Brier score.
  keep_only_if_improves: true

selection:
  # Transparent weighted score; PR-AUC dominates. `latency` rewards a model
  # that can actually serve a real-time API: the term is 1.0 at <=1 ms per
  # single transaction and decays to 0 at 100 ms. Batch throughput is NOT
  # used -- a 300-tree forest amortises to microseconds over 55k rows while
  # costing tens of milliseconds on a single row.
  weights:
    pr_auc: 0.45
    recall: 0.20
    f2: 0.15
    precision: 0.10
    fpr_penalty: 0.05
    latency: 0.10
